services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: iete
      POSTGRES_PASSWORD: iete_dev_password
      POSTGRES_DB: iete
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iete -d iete"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
